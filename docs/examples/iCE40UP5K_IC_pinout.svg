<svg xmlns="http://www.w3.org/2000/svg" width="600" height="398" viewBox="0 0 600 398">
  <!-- re:trace IC pinout diagram -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="pin-arrow" viewBox="0 0 10 6" refX="9" refY="3"
            markerWidth="7" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="context-stroke" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="600" height="398" fill="#0a0e1a"/>
  <rect width="600" height="40" fill="#111827" fill-opacity="0.92"/>
  <line x1="0" y1="40" x2="600" y2="40" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.4"/>
  <text x="12" y="26" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="13" fill="#22d3ee" font-weight="bold">re:trace</text>
  <text x="80" y="26" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="11" fill="#e2e8f0">iCE40UP5K — QFN-48</text>
  <rect x="230" y="70" width="140" height="120" rx="4" fill="#111827" stroke="#22d3ee" stroke-width="1.5"/>
  <path d="M 290 70 A 10 10 0 0 0 310 70" fill="#0a0e1a" stroke="#22d3ee" stroke-width="1"/>
  <text x="300" y="122" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="10" fill="#e2e8f0" font-weight="bold">iCE40UP5K</text>
  <text x="300" y="138" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="8" fill="#64748b">QFN-48</text>
  <rect x="20" y="220" width="560" height="148" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="240" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="11" fill="#22d3ee" font-weight="bold">Security Intelligence</text>
  <text x="36" y="256" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#ff6b6b" font-weight="600">Config Interface</text>
  <text x="200" y="256" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">SPI (Master), NVCM (one-time)</text>
  <text x="36" y="274" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#64748b" font-weight="600">Jtag Chain</text>
  <text x="200" y="274" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">False</text>
  <text x="36" y="292" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#64748b" font-weight="600">Bitstream Format</text>
  <text x="200" y="292" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">.bin (icestorm/nextpnr)</text>
  <text x="36" y="310" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#64748b" font-weight="600">Toolchain</text>
  <text x="200" y="310" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">Open-source: Yosys + nextpnr-ice40 + icestorm</text>
  <text x="36" y="328" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#64748b" font-weight="600">Lut Count</text>
  <text x="200" y="328" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">5280</text>
  <text x="36" y="346" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#ff6b6b" font-weight="600">Debug Relevance</text>
  <text x="200" y="346" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#e2e8f0">Fully open-source reversible — icestorm can decompile bitstream back to netlist</text>
  <rect y="374" width="600" height="24" fill="#111827" fill-opacity="0.92"/>
  <text x="300" y="390" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace" font-size="9" fill="#64748b">re:trace IC pinout — iCE40UP5K</text>
</svg>