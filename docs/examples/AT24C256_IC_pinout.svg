<svg xmlns="http://www.w3.org/2000/svg" width="600" height="408" viewBox="0 0 600 408">
  <!-- re:trace IC pinout diagram -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="pin-arrow" viewBox="0 0 10 6" refX="9" refY="3"
            markerWidth="7" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="context-stroke" fill-opacity="0.8"/>
    </marker>
  </defs>
  <rect width="600" height="408" fill="#0a0e1a"/>
  <rect width="600" height="40" fill="#111827" fill-opacity="0.92"/>
