[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retrace-pcb"
version = "0.1.0"
description = "AI-powered PCB reverse engineering toolkit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Eric Rihm", email = "hello@cobaltsystems.io"}]
keywords = ["pcb", "reverse-engineering", "computer-vision", "hardware-security", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
detection = [
    "ultralytics>=8.1",
    "onnxruntime>=1.16",
]
ocr = [
    "easyocr>=1.7",
]
web = [
    "gradio>=4.0",
]
all = [
    "retrace-pcb[detection,ocr,web]",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[project.scripts]
retrace = "retrace.cli:main"

[project.urls]
Homepage = "https://github.com/ericrihm/retrace"
Documentation = "https://github.com/ericrihm/retrace#readme"
Issues = "https://github.com/ericrihm/retrace/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
