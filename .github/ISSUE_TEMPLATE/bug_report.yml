name: Bug Report
description: Report a bug or unexpected behavior in retrace
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Run `retrace ...`
        2. Load board file `...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include full error output or tracebacks.
    validations:
      required: true

  - type: input
    id: retrace_version
    attributes:
      label: retrace Version
      description: Output of `retrace --version` or the git commit hash.
      placeholder: "e.g. 0.3.1 or abc1234"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: Output of `python --version`.
      placeholder: "e.g. 3.11.9"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: board_photo
    attributes:
      label: Board Photo (optional)
      description: If the issue is board-specific, attach a photo or image of the PCB. Drag and drop an image here.
    validations:
      required: false
